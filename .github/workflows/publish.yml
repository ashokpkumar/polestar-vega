name: Publish to PyPI

# Runs when you publish a GitHub Release. Uses PyPI "Trusted Publishing", so no token is stored.
# Setup (once): PyPI project -> Settings -> Publishing -> add a GitHub publisher:
#   owner ashokpkumar, repo polestar-vega, workflow publish.yml, environment pypi

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowmap-lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: flowmap-lib/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # needed for Trusted Publishing and provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
